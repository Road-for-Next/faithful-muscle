name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # 1. pnpm 설치 단계 추가
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm' # 2. npm 캐시 대신 pnpm 캐시 사용

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # 3. npm ci 대체

      - name: Build
        run: pnpm run build # 4. 빌드 명령어 변경
        env:
          NEXT_PUBLIC_BASE62_CHARS: ${{ secrets.NEXT_PUBLIC_BASE62_CHARS }}

      - name: Test
        run: pnpm test # 5. 테스트 명령어 변경
        env:
          NEXT_PUBLIC_BASE62_CHARS: ${{ secrets.NEXT_PUBLIC_BASE62_CHARS }}
