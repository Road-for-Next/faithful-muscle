name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm ci
      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE62_CHARS: ${{ secrets.NEXT_PUBLIC_BASE62_CHARS }}
      - name: Test
        run: pnpm test
        env:
          NEXT_PUBLIC_BASE62_CHARS: ${{ secrets.NEXT_PUBLIC_BASE62_CHARS }}
